version: "3.8"

services:
  # -------------------------
  # MongoDB Database
  # -------------------------
  mongodb:
    image: mongo:latest
    container_name: orion-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # Qdrant Vector Database (NEW Enterprise Data Plane)
  # -------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: orion-qdrant
    ports:
      - "6333:6333" # HTTP REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G

  # -------------------------
  # gRPC Executor Microservice
  # -------------------------
  executor-microservice:
    image: 2000023946/orion-executor:latest
    container_name: orion-executor
    ports:
      - "50051:50051"
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      METADATA_DB_URL: mongodb://host.docker.internal:27017
      QDRANT_TARGET_ADDRESS: http://host.docker.internal:6333
      # FIX: Must use 8080, because that is the port mapped to the host!
      EMBEDDING_TARGET_ADDRESS: http://host.docker.internal:8080
      WEB_API_KEY: ${WEB_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
    restart: unless-stopped

  # -------------------------
  # Backend (MCP API Gateway)
  # -------------------------
  api:
    build: 
      context: ./api-gateway
      dockerfile: dockerfile
    container_name: orion-api
    ports:
      - "8000:8000"
    depends_on:
      - executor-microservice
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      METADATA_DB_URL: mongodb://host.docker.internal:27017
      QDRANT_TARGET_ADDRESS: http://host.docker.internal:6333
      EMBEDDING_TARGET_ADDRESS: http://host.docker.internal:8080
      # FIX: gRPC requires no http:// prefix
      EXECUTOR_TARGET_ADDRESS: host.docker.internal:50051
    restart: unless-stopped

  # -------------------------
  # Text Embeddings Inference (Hugging Face Official)
  # -------------------------
  embedding-service:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: orion-embedding
    command: --model-id sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8080:80"
    volumes:
      - huggingface_data:/data 
    restart: unless-stopped

  # -------------------------
  # Frontend (Vite + React)
  # -------------------------
  frontend:
    build: ./frontend
    container_name: orion-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      # (Frontend actually runs in your Mac browser, so localhost is correct here)
      VITE_API_URL: http://localhost:8000
    restart: unless-stopped

  # -------------------------
  # Prometheus Monitoring
  # -------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: orion-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./api-gateway/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

# -------------------------
# Persistent Storage Volumes
# -------------------------
volumes:
  mongo_data:
  qdrant_data:
  prometheus_data:
  huggingface_data: