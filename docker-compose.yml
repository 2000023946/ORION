version: "3.8"

services:
  # -------------------------
  # Redis Task Bus (NEW V4/V5 Message Broker)
  # -------------------------
  redis-broker:
    image: redis:latest
    container_name: orion-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # MongoDB Database
  # -------------------------
  mongodb:
    image: mongo:latest
    container_name: orion-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # Qdrant Vector Database
  # -------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: orion-qdrant
    ports:
      - "6333:6333" # HTTP REST API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G

  # -------------------------
  # Background Executor Worker (Formerly gRPC Microservice)
  # -------------------------
  executor-microservice:
    build: 
      context: ./api-gateway
      dockerfile: dockerfile.executor
    container_name: orion-executor
    ports:
      - "8001:8000"
    # Removed port 50051 exposure since it no longer accepts direct inbound web traffic
    depends_on:
      mongodb:
        condition: service_healthy
      redis-broker:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      # Now connects to the Task Bus to pull jobs
      BUS_TARGET_ADDRESS: redis://redis-broker:6379/0
      
      METADATA_DB_URL: mongodb://host.docker.internal:27017
      QDRANT_TARGET_ADDRESS: http://host.docker.internal:6333
      EMBEDDING_TARGET_ADDRESS: http://host.docker.internal:8080
      WEB_API_KEY: ${WEB_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
    restart: unless-stopped

  # -------------------------
  # Backend (FastAPI Gateway)
  # -------------------------
  api:
    build: 
      context: ./api-gateway
      dockerfile: dockerfile
    container_name: orion-api
    ports:
      - "8000:8000"
    depends_on:
      redis-broker:
        condition: service_healthy
    environment:
      # Pushes tasks and subscribes to results via Redis
      BUS_TARGET_ADDRESS: redis://redis-broker:6379/0
      CACHE_TARGET_ADDRESS: redis://redis-broker:6379/1
    restart: unless-stopped

  # -------------------------
  # Text Embeddings Inference (Hugging Face Official)
  # -------------------------
  embedding-service:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: orion-embedding
    command: --model-id sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8080:80"
    volumes:
      - huggingface_data:/data 
    restart: unless-stopped

  # -------------------------
  # Frontend (Vite + React)
  # -------------------------
  frontend:
    build: ./frontend
    container_name: orion-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000
    restart: unless-stopped

  # -------------------------
  # Prometheus Monitoring
  # -------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: orion-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./api-gateway/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

# -------------------------
# Persistent Storage Volumes
# -------------------------
volumes:
  mongo_data:
  qdrant_data:
  prometheus_data:
  huggingface_data: