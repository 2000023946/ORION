version: "3.8"

services:
  # -------------------------
  # MongoDB Database
  # -------------------------
  mongodb:
    image: mongo:latest
    container_name: orion-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # gRPC Executor Microservice (NEW)
  # -------------------------
  executor-microservice:
    image: 2000023946/orion-executor:latest
    container_name: orion-executor
    ports:
      - "50051:50051"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # Executor does the heavy lifting, so it gets the DB and Tool API keys
      METADATA_DB_URL: mongodb://host.docker.internal:27017
      WEB_API_KEY: ${WEB_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY} # (If your tools need the LLM too)
      EMBEDDING_TARGET_ADDRESS: http://host.docker.internal:8080
    restart: unless-stopped

  # -------------------------
  # Backend (MCP API Gateway)
  # -------------------------
  api:
    build: 
      context: ./api-gateway
      dockerfile: dockerfile
    container_name: orion-api
    ports:
      - "8000:8000"
    depends_on:
      # Gateway now waits for the Executor to boot up, not the DB
      - executor-microservice
    environment:
      # Gateway needs the LLM key to generate the RetrievalPlan
      LLM_API_KEY: ${LLM_API_KEY}
      # Best Practice: Pass the gRPC address as an env variable!
      EXECUTOR_TARGET_ADDRESS: ${EXECUTOR_TARGET_ADDRESS}
    restart: unless-stopped


  # -------------------------
  # Text Embeddings Inference (Hugging Face Official)
  # -------------------------
  embedding-service:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: orion-embedding
    # Tell TEI exactly which model to download and serve
    command: --model-id sentence-transformers/all-MiniLM-L6-v2
    ports:
      - "8080:80"
    volumes:
      # CRITICAL: Cache the model weights so it doesn't download 90MB on every restart
      - huggingface_data:/data 
    restart: unless-stopped

  # -------------------------
  # Frontend (Vite + React)
  # -------------------------
  frontend:
    build: ./frontend
    container_name: orion-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000
    restart: unless-stopped

  # -------------------------
  # Prometheus Monitoring
  # -------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: orion-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./api-gateway/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

# -------------------------
# Persistent Storage
# -------------------------
volumes:
  mongo_data:
  prometheus_data:
  huggingface_data: