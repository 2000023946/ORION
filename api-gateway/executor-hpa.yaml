apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orion-executor-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orion-executor # Points directly to your deployment
  minReplicas: 2         # Never drop below 2 pods
  maxReplicas: 10        # Never scale beyond 10 pods (protects database/costs)
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # Scale up if average CPU exceeds 70% of requests (70m)