---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # ==========================================
      # OS Socket Backlog Expansion (Safe Sysctl)

      containers:
      - name: api-gateway
        image: 2000023946/orion-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources: 
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
          livenessProbe:          # <-- HERE
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:          # <-- HERE
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
        env:
          - name: METADATA_DB_URL
            value: "mongodb://orion-mongodb:27017"
          - name: EMBEDDING_TARGET_ADDRESS
            value: "http://orion-embedding:80"
          - name: EXECUTOR_TARGET_ADDRESS
            value: "orion-executor:50051"
          - name: BUS_TARGET_ADDRESS
            value: "redis://orion-redis:6379/0"
          - name: CACHE_TARGET_ADDRESS
            value: "redis://orion-redis:6379/1"
          - name: QDRANT_TARGET_ADDRESS
            value: "http://orion-qdrant:6333" 
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70