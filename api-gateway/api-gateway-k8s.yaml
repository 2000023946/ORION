---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 4 # Updated to match your pre-scaled HPA
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      # ==========================================
      # NEW: OS Socket Backlog Expansion
      # ==========================================
      securityContext:
        sysctls:
        - name: net.core.somaxconn
          value: "4096"
        - name: net.ipv4.tcp_max_syn_backlog
          value: "4096"
      containers:
      - name: api-gateway
        image: 2000023946/orion-api:latest # Updated to match your Docker Hub tag!
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        # The HPA requires these requests/limits to calculate CPU percentages
        resources: 
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
          - name: METADATA_DB_URL
            value: "mongodb://orion-mongodb:27017"
          - name: EMBEDDING_TARGET_ADDRESS
            value: "http://orion-embedding:80"
          - name: EXECUTOR_TARGET_ADDRESS
            value: "orion-executor:50051"
          - name: BUS_TARGET_ADDRESS
            value: "redis://orion-redis:6379/0"
          - name: CACHE_TARGET_ADDRESS
            value: "redis://orion-redis:6379/1"
          # ==========================================
          # NEW: Enterprise Vector Store Connection
          # ==========================================
          - name: QDRANT_TARGET_ADDRESS
            value: "http://orion-qdrant:6333" 
---
# The Autoscaler configuration
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 4
  maxReplicas: 4 
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70