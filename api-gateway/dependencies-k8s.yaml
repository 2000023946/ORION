# ==========================================
# 1. MongoDB Deployment & Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-mongodb
  template:
    metadata:
      labels:
        app: orion-mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: orion-mongodb
spec:
  selector:
    app: orion-mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

---
# ==========================================
# 2. Hugging Face TEI Deployment & Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-embedding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-embedding
  template:
    metadata:
      labels:
        app: orion-embedding
    spec:
      containers:
      - name: embedding
        image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest
        args: ["--model-id", "sentence-transformers/all-MiniLM-L6-v2"]
        ports:
        - containerPort: 80
        env:
        - name: PROMETHEUS_PORT
          value: "8081"
        resources:
          requests:
            cpu: "2"
          limits:
            cpu: "4" # Caps TEI so it doesn't crash the Minikube VM
---
apiVersion: v1
kind: Service
metadata:
  name: orion-embedding
spec:
  selector:
    app: orion-embedding
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
# ==========================================
# 3. Prometheus Configuration & Deployment
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 1s
    scrape_configs:
      - job_name: 'orion-executor'
        static_configs:
          - targets: ['orion-executor:8000']
          
      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway:8000']

      - job_name: 'redis-exporter'
        static_configs:
          - targets: ['redis-exporter:9121']
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config

---
# ==========================================
# 4. Qdrant Vector Database
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-qdrant
  template:
    metadata:
      labels:
        app: orion-qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
          name: http
        - containerPort: 6334
          name: grpc
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: orion-qdrant
spec:
  selector:
    app: orion-qdrant
  ports:
    - name: http
      protocol: TCP
      port: 6333
      targetPort: 6333
    - name: grpc
      protocol: TCP
      port: 6334
      targetPort: 6334

---
# ==========================================
# 5. Redis Task Bus (Message Broker)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-redis
  template:
    metadata:
      labels:
        app: orion-redis
    spec:
      containers:
      - name: redis
        image: redis:latest
        ports:
        - containerPort: 6379
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: orion-redis
spec:
  selector:
    app: orion-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

---
# ==========================================
# 6. Redis Exporter & Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        env:
        - name: REDIS_ADDR
          value: "redis://orion-redis:6379"  # Fixed to match your exact Redis service name
        args:
          - "-check-keys=queue:search_tasks"        # Tracks LLEN/size for your task queue key
        ports:
        - containerPort: 9121
          name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
spec:
  selector:
    app: redis-exporter
  ports:
    - protocol: TCP
      port: 9121
      targetPort: 9121

---
# ==========================================
# 7. Grafana Observability Dashboard
# ==========================================
# Data Source Provisioning (Prometheus connection)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      url: http://prometheus:9090
      access: proxy
      isDefault: true
---
# Dashboard Provider (Tells Grafana to load files from disk)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
data:
  default.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      options:
        path: /var/lib/grafana/dashboards
---
# The Dashboard JSON (Your pre-configured PromQL panels)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  orion-scaling.json: |
    {
      "title": "Orion Scaling & Bottlenecks",
      "refresh": "5s",
      "panels": [
        {
          "title": "Redis Queue Depth (Raw)",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "redis_key_size{key=\"queue:search_tasks\"}",
              "legendFormat": "Tasks in Queue",
              "refId": "A"
            }
          ]
        },
        {
          "title": "KEDA Scaling Metric (15s Window)",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(max_over_time(redis_key_size{key=\"queue:search_tasks\"}[15s]))",
              "legendFormat": "KEDA Perceived Queue",
              "refId": "B"
            }
          ]
        }
      ],
      "schemaVersion": 36
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-grafana
  template:
    metadata:
      labels:
        app: orion-grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources/prometheus.yaml
          subPath: prometheus.yaml
        - name: grafana-dashboard-providers
          mountPath: /etc/grafana/provisioning/dashboards/default.yaml
          subPath: default.yaml
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
      volumes:
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboard-providers
        configMap:
          name: grafana-dashboard-providers
      - name: grafana-dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: orion-grafana
spec:
  selector:
    app: orion-grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000