# ==========================================
# 1. MongoDB Deployment & Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-mongodb
  template:
    metadata:
      labels:
        app: orion-mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: orion-mongodb
spec:
  selector:
    app: orion-mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

---
# ==========================================
# 2. Hugging Face TEI Deployment & Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-embedding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-embedding
  template:
    metadata:
      labels:
        app: orion-embedding
    spec:
      containers:
      - name: embedding
        # CHANGE THIS EXACT LINE:
        image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest
        args: ["--model-id", "sentence-transformers/all-MiniLM-L6-v2"]
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: orion-embedding
spec:
  selector:
    app: orion-embedding
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80