# ==========================================
# 1. MongoDB Deployment & Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-mongodb
  template:
    metadata:
      labels:
        app: orion-mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: orion-mongodb
spec:
  selector:
    app: orion-mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

---
# ==========================================
# 2. Hugging Face TEI Deployment & Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-embedding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-embedding
  template:
    metadata:
      labels:
        app: orion-embedding
    spec:
      containers:
      - name: embedding
        image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest
        args: ["--model-id", "sentence-transformers/all-MiniLM-L6-v2"]
        ports:
        - containerPort: 80
        env:
        - name: PROMETHEUS_PORT
          value: "8081"
---
apiVersion: v1
kind: Service
metadata:
  name: orion-embedding
spec:
  selector:
    app: orion-embedding
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---
# ==========================================
# 3. Prometheus Configuration & Deployment
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: 'orion-executor'
        static_configs:
          - targets: ['orion-executor:8000']
          
      - job_name: 'api-gateway'
        static_configs:
          - targets: ['api-gateway:8000']

      - job_name: 'redis-exporter'
        static_configs:
          - targets: ['redis-exporter:9121']
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - protocol: TCP
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: config-volume
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml
      volumes:
      - name: config-volume
        configMap:
          name: prometheus-config

---
# ==========================================
# 4. Qdrant Vector Database
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-qdrant
  template:
    metadata:
      labels:
        app: orion-qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
          name: http
        - containerPort: 6334
          name: grpc
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: orion-qdrant
spec:
  selector:
    app: orion-qdrant
  ports:
    - name: http
      protocol: TCP
      port: 6333
      targetPort: 6333
    - name: grpc
      protocol: TCP
      port: 6334
      targetPort: 6334

---
# ==========================================
# 5. Redis Task Bus (Message Broker)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orion-redis
  template:
    metadata:
      labels:
        app: orion-redis
    spec:
      containers:
      - name: redis
        image: redis:latest
        ports:
        - containerPort: 6379
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: orion-redis
spec:
  selector:
    app: orion-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

---
# ==========================================
# 6. Redis Exporter & Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        env:
        - name: REDIS_ADDR
          value: "redis://orion-redis:6379"  # Fixed to match your exact Redis service name
        args:
          - "-check-keys=orion_queue"        # Tracks LLEN/size for your task queue key
        ports:
        - containerPort: 9121
          name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
spec:
  selector:
    app: redis-exporter
  ports:
    - protocol: TCP
      port: 9121
      targetPort: 9121