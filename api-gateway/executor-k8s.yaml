apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-executor
  labels:
    app: orion-executor
spec:
  replicas: 2 # Start with a baseline of 2 pods
  selector:
    matchLabels:
      app: orion-executor
  template:
    metadata:
      labels:
        app: orion-executor
    spec:
      containers:
      - name: executor
        image: 2000023946/orion-executor:latest
        imagePullPolicy: Always # Ensures K8s always pulls your newest push
        ports:
          - containerPort: 50051
            name: grpc
          - containerPort: 8000   # Exposes metrics inside the container
            name: metrics
        env:
        # K8s Internal DNS routing
        - name: METADATA_DB_URL
          value: "mongodb://orion-mongodb:27017"
        - name: EMBEDDING_TARGET_ADDRESS
          value: "http://orion-embedding:80"
        envFrom:
        - secretRef:
            name: orion-secrets
            optional: true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: orion-executor
spec:
  selector:
    app: orion-executor
  ports:
    - name: grpc              # Added explicit port naming for clarity
      protocol: TCP
      port: 50051
      targetPort: 50051
    - name: metrics           # <--- FIXED: Open the network routing door for Prometheus
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orion-executor-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orion-executor
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70 # Scale up if average CPU hits 70%