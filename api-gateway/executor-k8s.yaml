apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-executor
  labels:
    app: orion-executor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orion-executor
  template:
    metadata:
      labels:
        app: orion-executor
    spec:
      containers:
      - name: executor
        image: 2000023946/orion-executor:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 50051
            name: grpc
          - containerPort: 8000
            name: metrics
        env:
        - name: METADATA_DB_URL
          value: "mongodb://orion-mongodb:27017"
        - name: EMBEDDING_TARGET_ADDRESS
          value: "http://orion-embedding:80"
        - name: QDRANT_TARGET_ADDRESS
          value: "http://orion-qdrant:6333"
          
        # ==========================================
        # MOCK KEYS: Prevents Python KeyErrors on boot
        # ==========================================
        - name: LLM_API_KEY
          value: "mock_llm_key_local_testing"
        - name: WEB_API_KEY
          value: "mock_web_key_local_testing"
          
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: orion-executor
spec:
  selector:
    app: orion-executor
  ports:
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051
    - name: metrics
      protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orion-executor-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orion-executor
  minReplicas: 2
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70